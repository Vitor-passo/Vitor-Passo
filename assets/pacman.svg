<svg
  width="900"
  height="150"
  viewBox="0 0 900 150"
  xmlns="http://www.w3.org/2000/svg"
>

  <defs>

    <!-- BOCA DO PAC-MAN -->

    <mask
      id="pacman-mouth"
      maskUnits="userSpaceOnUse"
      x="-30"
      y="25"
      width="70"
      height="70"
    >

      <circle
        cx="0"
        cy="58"
        r="21"
        fill="white"
      />

      <path
        d="M0 58 L25 43 A21 21 0 0 1 25 73 Z"
        fill="black"
      >

        <animate
          attributeName="d"
          dur="0.35s"
          repeatCount="indefinite"
          values="
            M0 58 L25 43 A21 21 0 0 1 25 73 Z;
            M0 58 L20 53 A21 21 0 0 1 20 63 Z;
            M0 58 L25 43 A21 21 0 0 1 25 73 Z
          "
        />

      </path>

    </mask>

  </defs>


  <!-- FUNDO -->

  <rect
    width="900"
    height="150"
    rx="12"
    fill="#0d1117"
  />


  <!-- ======================================
       VITOR PASSO
       ====================================== -->

  <g
    font-family="Inter, Arial, sans-serif"
    font-size="16"
    font-weight="400"
    letter-spacing="18"
    fill="#f0f6fc"
    text-anchor="middle"
  >

    <!-- V -->

    <text x="270" y="64">
      V

      <animate
        attributeName="opacity"
        dur="16s"
        repeatCount="indefinite"
        values="1;1;0;0;1"
        keyTimes="0;0.336;0.356;0.86;1"
      />

    </text>


    <!-- I -->

    <text x="306" y="64">
      I

      <animate
        attributeName="opacity"
        dur="16s"
        repeatCount="indefinite"
        values="1;1;0;0;1"
        keyTimes="0;0.369;0.389;0.86;1"
      />

    </text>


    <!-- T -->

    <text x="342" y="64">
      T

      <animate
        attributeName="opacity"
        dur="16s"
        repeatCount="indefinite"
        values="1;1;0;0;1"
        keyTimes="0;0.402;0.422;0.86;1"
      />

    </text>


    <!-- O -->

    <text x="378" y="64">
      O

      <animate
        attributeName="opacity"
        dur="16s"
        repeatCount="indefinite"
        values="1;1;0;0;1"
        keyTimes="0;0.435;0.455;0.86;1"
      />

    </text>


    <!-- R -->

    <text x="414" y="64">
      R

      <animate
        attributeName="opacity"
        dur="17s"
        repeatCount="indefinite"
        values="1;1;0;0;1"
        keyTimes="0;0.467;0.487;0.86;1"
      />

    </text>


    <!-- P -->

    <text x="486" y="64">
      P

      <animate
        attributeName="opacity"
        dur="16s"
        repeatCount="indefinite"
        values="1;1;0;0;1"
        keyTimes="0;0.533;0.553;0.86;1"
      />

    </text>


    <!-- A -->

    <text x="522" y="64">
      A

      <animate
        attributeName="opacity"
        dur="16s"
        repeatCount="indefinite"
        values="1;1;0;0;1"
        keyTimes="0;0.565;0.585;0.86;1"
      />

    </text>


    <!-- S -->

    <text x="558" y="64">
      S

      <animate
        attributeName="opacity"
        dur="16s"
        repeatCount="indefinite"
        values="1;1;0;0;1"
        keyTimes="0;0.598;0.618;0.86;1"
      />

    </text>


    <!-- S -->

    <text x="594" y="64">
      S

      <animate
        attributeName="opacity"
        dur="16s"
        repeatCount="indefinite"
        values="1;1;0;0;1"
        keyTimes="0;0.631;0.651;0.86;1"
      />

    </text>


    <!-- O -->

    <text x="630" y="64">
      O

      <animate
        attributeName="opacity"
        dur="16s"
        repeatCount="indefinite"
        values="1;1;0;0;1"
        keyTimes="0;0.664;0.684;0.86;1"
      />

    </text>

  </g>


  <!-- ======================================
       PAC-MAN
       ====================================== -->

  <g>

    <!-- Movimento contínuo -->

    <animateMotion
      dur="16s"
      repeatCount="indefinite"
      rotate="0"
      path="M -100,0 C 150,0 900,0 1000,0"
    />


    <!-- Corpo perfeitamente circular -->

    <circle
      cx="0"
      cy="58"
      r="21"
      fill="#F7DF1E"
      mask="url(#pacman-mouth)"
    />

  </g>


  <!-- ======================================
       PROFISSÃO
       ====================================== -->

  <text
    x="450"
    y="104"
    text-anchor="middle"
    font-family="Inter, Arial, sans-serif"
    font-size="10"
    font-weight="400"
    letter-spacing="3"
    fill="#8B6F47"
  >

    DESIGNER · UI/UX · FRONT-END

  </text>

</svg>
